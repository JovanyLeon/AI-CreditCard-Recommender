name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  ENABLE_OPENAI: 'false'
  OPENAI_API_KEY: ''

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/constraints.txt
      - run: python -m pip install -c backend/constraints.txt -e './backend[dev,ai]'
      - run: python -m ruff check backend scripts
      - run: python -m ruff format --check backend scripts
      - run: python -m mypy app scripts
        working-directory: backend
      - run: python -m pytest -q
        working-directory: backend
      - run: python -m scripts.import_cards
        working-directory: backend
      - run: git diff --exit-code backend/app/data/cards.json

  without-openai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -c backend/constraints.txt -e './backend[dev]'
      - run: python -c "import importlib.util; assert importlib.util.find_spec('openai') is None"
      - run: python -m pytest -q
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --global npm@11
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: python -m pip install -c ../backend/constraints.txt -e '../backend'
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          PYTHON: python
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: frontend/test-results/
